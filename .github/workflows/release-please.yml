name: Release Please

# Шага публикации здесь нет намеренно: packagist забирает версию вебхуком по
# тегу, поэтому достаточно, чтобы release-please тег поставил. Проверено: у всех
# шести библиотек на packagist включён auto-update.
on:
  push:
    branches:
      - main

permissions: {}

# Релиз не отменяется новым пушем: следующий прогон ждёт, пока закончится текущий.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
